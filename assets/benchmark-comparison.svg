<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="528" viewBox="0 0 1000 528" role="img" aria-labelledby="title desc">
<title id="title">GPT-6.2 Sol: image context trimming benchmark</title>
<desc id="desc">Same four-task retrieval workflow, 13 requests and 19 of 19 correct fields in each arm. Request JSON decreased 62.7 percent, image Base64 decreased 62.9 percent, Zstandard body estimate decreased 60.2 percent, image blocks decreased 65.6 percent, total tokens decreased 19.9 percent. Uncached input increased 13.0 percent and estimated catalog cost increased 8.7 percent.</desc>
